<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UNIQUE Player</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Segoe UI, Arial, sans-serif; color: #f4f7ff; background: #05070d; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #17213f, #05070d 55%); }
    main { width: min(760px, 100%); border: 1px solid rgba(255,255,255,.14); border-radius: 8px; background: rgba(10,14,26,.72); backdrop-filter: blur(18px); padding: 20px; }
    input, button { border-radius: 8px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.07); color: inherit; padding: 10px 12px; }
    button { background: #29d391; color: #03120c; font-weight: 800; cursor: pointer; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
    .card { border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 14px; background: rgba(255,255,255,.045); }
    img { max-width: 100%; image-rendering: pixelated; object-fit: contain; }
    .muted { color: #a8b3ca; }
  </style>
</head>
<body>
  <main>
    <h1>UNIQUE Player</h1>
    <div class="row">
      <input id="nick" placeholder="nickname">
      <button id="load" type="button">Открыть</button>
    </div>
    <div id="result" class="grid"></div>
  </main>
  <script>
    const result = document.getElementById('result');
    const esc = (v) => String(v || '').replace(/[<>&]/g, (ch) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[ch]));
    document.getElementById('load').addEventListener('click', async () => {
      const nick = document.getElementById('nick').value.trim();
      const res = await fetch(`/player/api/profile/${encodeURIComponent(nick)}`);
      const data = await res.json();
      if (!data.success) {
        result.innerHTML = `<div class="card">${esc(data.error)}</div>`;
        return;
      }
      const music = data.profile.music && data.profile.music.displayText ? data.profile.music.displayText : 'Не слушает';
      const assets = data.assets.map((asset) => `<div class="card"><strong>${esc(asset.asset_type)}</strong><p class="muted">${esc(asset.sha256)}</p>${asset.url ? `<img src="${esc(asset.url)}" alt="">` : ''}</div>`).join('');
      result.innerHTML = `<div class="card"><h2>${esc(data.player.nickname)}</h2><p>${esc(music)}</p><p>${esc(data.profile.youtube_url || '')}</p><p>${esc(data.profile.twitch_url || '')}</p></div>${assets}`;
    });
  </script>
</body>
</html>
