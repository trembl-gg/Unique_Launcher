[package]
name = "unique-launcher"
version = "1.0.2"
edition = "2021"
publish = false
build = "rust/build.rs"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "unique-launcher"
path = "rust/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
wry = "0.57"
rfd = "0.15"
url = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell_PropertiesSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
