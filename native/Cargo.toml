[package]
name = "unique-launcher-native"
version = "1.0.2"
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
unique-launcher = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
flate2 = "1"
crc32fast = "1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Networking_WinHttp", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
